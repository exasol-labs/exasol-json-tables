name: release

# Builds the deployable artifacts for a tagged release and attaches them to it:
# the ingest CLI, the in-database loader library, and the Python distributions.
# Run it by hand with `tag` to rebuild the assets of an existing release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and upload assets for (e.g. v0.3)."
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  cli:
    name: json_to_parquet (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-14
            label: macos-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # exarrow-rs pulls in aws-lc-sys, which builds C and assembly from source.
      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake clang nasm

      - name: Pin the toolchain
        run: rustup update stable --no-self-update && rustup default stable

      # The live-database e2e tests are #[ignore]d; they need a running Exasol.
      - name: Test
        run: cargo test --locked --manifest-path crates/json_tables_ingest/Cargo.toml

      - name: Build
        run: cargo build --release --locked --manifest-path crates/json_tables_ingest/Cargo.toml

      - name: Package
        run: |
          set -euo pipefail
          staging="json_to_parquet-${TAG}-${{ matrix.label }}"
          mkdir -p "out/${staging}"
          cp crates/json_tables_ingest/target/release/json_to_parquet "out/${staging}/"
          cp crates/json_tables_ingest/README.md "out/${staging}/README.md"
          cp LICENSE "out/${staging}/"
          tar -czf "out/${staging}.tar.gz" -C out "${staging}"
          rm -rf "out/${staging}"

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.label }}
          path: out/*.tar.gz
          if-no-files-found: error

  udf:
    name: json_tables_udf (linux-x86_64)
    runs-on: ubuntu-latest
    # The loader is dlopened by the script language container, so it has to link
    # against that container's glibc. Trixie (glibc 2.41) is the Debian release the
    # SLC stages its runtime from; see crates/json_tables_udf/README.md.
    container: rust:1.98.1-trixie
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # Tested on the same toolchain and glibc the loader is built with.
      - name: Test
        run: |
          cargo test --locked --manifest-path crates/json_tables_core/Cargo.toml
          cargo test --locked --manifest-path crates/json_tables_udf/Cargo.toml

      - name: Build
        run: cargo build --release --locked --manifest-path crates/json_tables_udf/Cargo.toml

      - name: Package
        run: |
          set -euo pipefail
          staging="json_tables_udf-${TAG}-linux-x86_64"
          mkdir -p "out/${staging}"
          cp crates/json_tables_udf/target/release/libjson_tables_udf.so "out/${staging}/"
          cp crates/json_tables_udf/sql/install.sql "out/${staging}/"
          cp crates/json_tables_udf/README.md "out/${staging}/README.md"
          cp LICENSE "out/${staging}/"
          tar -czf "out/${staging}.tar.gz" -C out "${staging}"
          rm -rf "out/${staging}"

      - name: Record the glibc it was built against
        run: |
          ldd --version | head -1
          objdump -T crates/json_tables_udf/target/release/libjson_tables_udf.so \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - uses: actions/upload-artifact@v7
        with:
          name: udf-linux-x86_64
          path: out/*.tar.gz
          if-no-files-found: error

  python:
    name: exasol-json-tables (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        # --outdir is explicit because the repository already has a tracked dist/.
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist-release

      - uses: actions/upload-artifact@v7
        with:
          name: python-dists
          path: dist-release/*
          if-no-files-found: error

  # Release gate: nothing is attached to the release unless mypy is clean.
  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Type-check
        run: python -m mypy

  # Release gate: nothing is attached while a shipped crate has an open RustSec
  # advisory. The same check runs on PRs and weekly in advisories.yml.
  advisories:
    name: cargo-deny (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [json_tables_core, json_tables_ingest, json_tables_udf]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check advisories
          manifest-path: crates/${{ matrix.crate }}/Cargo.toml

  publish:
    name: Attach to the release
    needs: [typecheck, advisories, cli, udf, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v8
        with:
          path: staged
          merge-multiple: true

      - name: Checksum
        run: |
          set -euo pipefail
          cd staged
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" staged/* --clobber
