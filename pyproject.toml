[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exasol-json-tables"
version = "0.3.2"
description = "Exasol JSON Tables: ingest, query, and reshape JSON-shaped data in Exasol."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "pyexasol>=3.0.1,<4",
  "exasol-telemetry-client>=0.2.1,<0.3",
]

[project.optional-dependencies]
dev = [
  "mypy==2.4.*",
  "ruff==0.17.*",
]

[project.scripts]
exasol-json-tables = "exasol_json_tables.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
exasol_json_tables = ["preprocessor_assets/*.lua"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# Bug-focused: pyflakes, pycodestyle errors, bugbear. Formatting is not enforced.
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# Compatibility wrappers re-export the package module with `import *`.
"tools/*.py" = ["F405"]

[tool.mypy]
python_version = "3.10"
files = ["python/exasol_json_tables"]
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
