[package]
name = "json_tables_udf"
version = "0.3.2"
edition = "2021"
description = "In-database JSON Tables loader: an Exasol Rust UDF that ingests JSON into the shared table contract."
license = "MIT"

[lib]
# cdylib is the deployable artifact; rlib keeps the logic unit-testable on the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
json_tables_core = { path = "../json_tables_core" }
# 0.33 exposes connect-back unconditionally; this loader needs none of the
# optional features (`emit-arrow`, `import`, `export`).
# Exact pins: the language container accepts only a loader built with its own
# SDK version and rustc (see README "Build and deploy"). 0.33 pairs with rustc
# 1.98.1, the rust:1.98.1-trixie image in the CI and release workflows.
exasol-udf-sdk = "=0.33.0"
exasol-udf-macros = "=0.33.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[profile.release]
strip = true
