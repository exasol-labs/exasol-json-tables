[package]
name = "json_to_parquet"
version = "0.1.0"
edition = "2021"
description = "CLI tool to convert JSON input into Parquet output files."
license = "MIT"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
parquet = "58.3"
tokio = { version = "1.53", features = ["rt-multi-thread", "sync"] }
exarrow-rs = "0.16.0"

[dev-dependencies]
arrow = "58.3"
tempfile = "3.27"
